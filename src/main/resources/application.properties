quarkus.application.name=kosmos

# All REST resources live under /api so Quinoa's SPA-routing fallback never collides with a
# backend @Path that matches a frontend route (e.g. GET /anime/{id} vs. the /anime/:id page) — a
# full browser reload on a detail route used to hit the REST resource directly and return raw
# JSON instead of the SPA shell. Session cookie path is "/", so this doesn't affect auth.
quarkus.rest.path=/api

quarkus.datasource.db-kind=postgresql

# Explicit connection info only for prod (packaged jar / Docker). Dev and test have no
# datasource config here on purpose, so Quarkus Dev Services auto-provisions a disposable
# Postgres container via Testcontainers — just run ./gradlew quarkusDev, no setup needed.
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/kosmos
%prod.quarkus.datasource.username=kosmos
%prod.quarkus.datasource.password=kosmos

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

quarkus.smallrye-openapi.path=/openapi

# TMDB search-as-you-type cache (see research-dossier.md "HTTP response caching") — 24h, well
# under TMDB's own 6-month cache-retention ceiling, with a bounded size so arbitrary user-typed
# queries can't grow the cache without limit.
quarkus.cache.caffeine."tmdb-search-movie".expire-after-write=24H
quarkus.cache.caffeine."tmdb-search-movie".maximum-size=500

# TmdbMetadataProvider#searchMovieByTitleAndYear — a Jellyfin sync's title+year recovery search,
# same reasoning/TTL as tmdb-movie-by-id since it's keyed on a specific (title, year) pair.
quarkus.cache.caffeine."tmdb-movie-search-by-year".expire-after-write=7D
quarkus.cache.caffeine."tmdb-movie-search-by-year".maximum-size=500
quarkus.cache.caffeine."tmdb-search-tv".expire-after-write=24H
quarkus.cache.caffeine."tmdb-search-tv".maximum-size=500

# Per-movie/show detail lookups (runtime, season/episode tree) — not a repeated-call hot path
# (each is called exactly once, at creation), but cached anyway so a double "Add" click or a
# retry after a transient failure doesn't redo it. Longer TTL than search: this data is close to
# permanent once a title has released.
quarkus.cache.caffeine."tmdb-movie-details".expire-after-write=7D
quarkus.cache.caffeine."tmdb-movie-details".maximum-size=500
quarkus.cache.caffeine."tmdb-movie-by-id".expire-after-write=7D
quarkus.cache.caffeine."tmdb-movie-by-id".maximum-size=2000

# TmdbMetadataProvider#fetchCollection — a collection's member list changes only when TMDB adds a
# new entry to the franchise, same "close to permanent" reasoning as tmdb-movie-details.
quarkus.cache.caffeine."tmdb-collection".expire-after-write=7D
quarkus.cache.caffeine."tmdb-collection".maximum-size=500
quarkus.cache.caffeine."tmdb-movie-recommendations".expire-after-write=12H
quarkus.cache.caffeine."tmdb-movie-recommendations".maximum-size=200
quarkus.cache.caffeine."tmdb-show-structure".expire-after-write=7D
quarkus.cache.caffeine."tmdb-show-structure".maximum-size=500
quarkus.cache.caffeine."tmdb-show-by-id".expire-after-write=7D
quarkus.cache.caffeine."tmdb-show-by-id".maximum-size=2000

# TmdbMetadataProvider#findTvIdByTvdbId — SonarrSyncService's tvdbId->tmdbId fallback; 7D, same
# reasoning as tmdb-show-by-id since it's keyed on a stable external id.
quarkus.cache.caffeine."tmdb-find-by-tvdb".expire-after-write=7D
quarkus.cache.caffeine."tmdb-find-by-tvdb".maximum-size=2000
quarkus.cache.caffeine."tmdb-movie-detail-extras".expire-after-write=3D
quarkus.cache.caffeine."tmdb-movie-detail-extras".maximum-size=1000
quarkus.cache.caffeine."tmdb-tv-detail-extras".expire-after-write=3D
quarkus.cache.caffeine."tmdb-tv-detail-extras".maximum-size=1000

# TmdbMetadataProvider#showHasAnimeKeyword — one extra check per ambiguous show/anime match during
# a Jellyfin sync; 7D since a title's TMDB keywords rarely change.
quarkus.cache.caffeine."tmdb-tv-anime-keyword".expire-after-write=7D
quarkus.cache.caffeine."tmdb-tv-anime-keyword".maximum-size=2000

# Per-season/per-details pieces of fetchShowStructure, cached independently (TmdbTvDetailClient)
# so a retry after a partial failure only re-fetches the season that actually failed.
quarkus.cache.caffeine."tmdb-show-details".expire-after-write=7D
quarkus.cache.caffeine."tmdb-show-details".maximum-size=500
quarkus.cache.caffeine."tmdb-season-episodes".expire-after-write=7D
quarkus.cache.caffeine."tmdb-season-episodes".maximum-size=5000

# Discover/Home rows — every single page load hits the identical query (no per-query cache key
# variance like search has), so this has the strongest case of anything cached so far. 12h.
# Sizes here account for the (window/mediaType/page) or (id/page) combos each cache now sees, not
# just the single fixed row query — a user scrolling a list page's infinite scroll adds a new
# cache entry per page, and the discover-by-id caches now see one entry per (id, page) pair.
quarkus.cache.caffeine."tmdb-trending".expire-after-write=12H
quarkus.cache.caffeine."tmdb-trending".maximum-size=60
quarkus.cache.caffeine."tmdb-trending-tv".expire-after-write=12H
quarkus.cache.caffeine."tmdb-trending-tv".maximum-size=60
quarkus.cache.caffeine."tmdb-trending-all".expire-after-write=12H
quarkus.cache.caffeine."tmdb-trending-all".maximum-size=60
quarkus.cache.caffeine."tmdb-popular".expire-after-write=12H
quarkus.cache.caffeine."tmdb-popular".maximum-size=20
quarkus.cache.caffeine."tmdb-upcoming-movies".expire-after-write=12H
quarkus.cache.caffeine."tmdb-upcoming-movies".maximum-size=20
quarkus.cache.caffeine."tmdb-popular-tv".expire-after-write=12H
quarkus.cache.caffeine."tmdb-popular-tv".maximum-size=20
quarkus.cache.caffeine."tmdb-upcoming-tv".expire-after-write=12H
quarkus.cache.caffeine."tmdb-upcoming-tv".maximum-size=1
quarkus.cache.caffeine."tmdb-upcoming-tv-paged".expire-after-write=12H
quarkus.cache.caffeine."tmdb-upcoming-tv-paged".maximum-size=20
quarkus.cache.caffeine."tmdb-movie-genres".expire-after-write=7D
quarkus.cache.caffeine."tmdb-movie-genres".maximum-size=1
quarkus.cache.caffeine."tmdb-tv-genres".expire-after-write=7D
quarkus.cache.caffeine."tmdb-tv-genres".maximum-size=1
quarkus.cache.caffeine."tmdb-discover-movie-genre".expire-after-write=12H
quarkus.cache.caffeine."tmdb-discover-movie-genre".maximum-size=500
quarkus.cache.caffeine."tmdb-discover-tv-genre".expire-after-write=12H
quarkus.cache.caffeine."tmdb-discover-tv-genre".maximum-size=500
quarkus.cache.caffeine."tmdb-discover-movie-company".expire-after-write=12H
quarkus.cache.caffeine."tmdb-discover-movie-company".maximum-size=500
quarkus.cache.caffeine."tmdb-discover-tv-network".expire-after-write=12H
quarkus.cache.caffeine."tmdb-discover-tv-network".maximum-size=500

# AniList (§07 Phase 3) — same reasoning as TMDB's own search/detail caches.
quarkus.cache.caffeine."anilist-search".expire-after-write=24H
quarkus.cache.caffeine."anilist-search".maximum-size=500
quarkus.cache.caffeine."anilist-media".expire-after-write=7D
quarkus.cache.caffeine."anilist-media".maximum-size=500
quarkus.cache.caffeine."anilist-detail-extras".expire-after-write=7D
quarkus.cache.caffeine."anilist-detail-extras".maximum-size=500

# Fribb/anime-lists (§07 Phase 3) — a single ~7.5MB static file, not a per-query API; cached whole,
# same "one blob, long TTL" shape as tmdb-trending/tmdb-popular. 7D since the mapping only grows as
# new anime gets added upstream, not something that goes stale meaningfully faster than that.
quarkus.cache.caffeine."fribb-mapping".expire-after-write=7D
quarkus.cache.caffeine."fribb-mapping".maximum-size=1

# Same file reversed to TMDB TV id (FribbMappingProvider#loadMappingByTmdbTvId) — used to tell a
# Jellyfin "tvshows" item is actually anime during sync. Same shape/TTL as fribb-mapping above.
quarkus.cache.caffeine."fribb-by-tmdb-tv".expire-after-write=7D
quarkus.cache.caffeine."fribb-by-tmdb-tv".maximum-size=1

# TheXEM (§07 Phase 3) — one map per anidb id, not a single blob like Fribb's file; a scene/anidb
# numbering map is effectively static once a show has aired, so 7D matches Fribb's TTL reasoning.
# Bounded to 2000 distinct anidb ids, comfortably above any real library's anime count.
quarkus.cache.caffeine."thexem-anidb-map".expire-after-write=7D
quarkus.cache.caffeine."thexem-anidb-map".maximum-size=2000

# Plugin registry listing — a small, infrequently-changing list; long TTL mainly to stay well
# under GitHub's unauthenticated 60 req/hour rate limit.
quarkus.cache.caffeine."plugin-registry".expire-after-write=1H
quarkus.cache.caffeine."plugin-registry".maximum-size=1

quarkus.quinoa.build-dir=build
quarkus.quinoa.enable-spa-routing=true

# The UBI9 JDK build image has no system Node/npm, so Quinoa must download its own — this is
# disabled by default (it otherwise assumes a system-provided npm on PATH). %prod-only: dev/test
# use whatever Node is already on the machine running ./gradlew quarkusDev. Note: the config
# group's "enabled" field uses @WithParentName, so the key is the group path itself, not
# "...package-manager-install.enabled".
%prod.quarkus.quinoa.package-manager-install=true
%prod.quarkus.quinoa.package-manager-install.node-version=22.14.0

# Proxy to the already-running `npm run dev` (Vite) instead of serving the static build/quinoa
# bundle, so frontend edits show up on :8080 without a Quarkus restart.
%dev.quarkus.quinoa.dev-server-port=5173

# Scratch import root for dev mode only — safe to hardlink/write test files into, never a real
# media library. Not set for %prod/%test; ImportService treats an unset value as a real error.
%dev.kosmos.library.root-path=.devdata/library

# Dev-only convenience — see SessionFilter's own doc. Every request is logged in as the first
# admin account, no login round trip needed after a fresh database reset. Never set outside %dev;
# there is no %prod equivalent key, so a packaged build can't accidentally ship this on.
%dev.kosmos.auth.dev-bypass=true

# BackupService — where pg_dump archives land, and how many to keep. Relative paths resolve
# against the process's working directory, same as kosmos.library.root-path.
kosmos.backup.dir=backups
kosmos.backup.retention=7
%dev.kosmos.backup.dir=.devdata/backups
